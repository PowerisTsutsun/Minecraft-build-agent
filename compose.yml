# A complete, runnable setup: one vanilla 26.2 server and the bot driving it.
#
#   ./setup.sh                      # writes .env, starts both, waits for rcon
#
# or by hand:
#
#   cp .env.example .env            # set BUILDER and RCON_PASSWORD
#   docker compose up -d
#   docker compose logs -f bot      # wait for "rcon connected"
#
# Then join the server and type:  !build list
#
# Already have a server? Delete the `mc` service, point `bot`'s two read-only
# mounts at your server's logs/ and world/ directories, and set MC_SERVER to the
# matching entry in rcon-servers.json. The server needs enable-rcon=true.

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc
    ports:
      - "25565:25565"
      - "127.0.0.1:25575:25575"     # rcon, loopback only - the bot uses host networking
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.2"
      MEMORY: "2G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      ENFORCE_SECURE_PROFILE: "false"
    volumes:
      - ./server/data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true

  bot:
    image: node:22-alpine
    container_name: mc-builder-bot
    network_mode: host
    working_dir: /app
    environment:
      MC_SERVER: "mc"                 # which rcon-servers.json entry to drive
      MC_MAX_BLOCKS: "500000"         # refuse anything bigger; downloaded builds run to ~370k
      RCON_PASSWORD: ${RCON_PASSWORD}
      # Who may build. rcon-servers.example.json reads it as ${BUILDER}; unset
      # means the bot refuses everyone rather than opening the console.
      BUILDER: ${BUILDER:-}
    volumes:
      - ./:/app
      # The server's data directory, read-only. Three things are read from it,
      # and none of them can be got any other way:
      #   logs/   - RCON can send commands but cannot receive chat, so the bot
      #             tails the log for "<Player> !build ..." and answers by
      #             /tellraw.
      #   world/  - no command reports what block is at a position, so reading
      #             a build means reading the region files.
      #   ops.json - vanilla has no command that reports whether a player is an
      #             operator, and "anyone this server ops may build" is the
      #             default access policy.
      - ./server/data:/servers/mc:ro
    command: sh -c "npm install --omit=dev && npm start"
    depends_on:
      - mc
    restart: unless-stopped
